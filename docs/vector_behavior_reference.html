function getFamilies(anims) {
  const families = {};
  anims.forEach(a => {
    const parts = a.split('_');
    let family = 'other';
    if(a.startsWith('anim_') && parts.length >= 3) family = 'anim_' + parts[1];
    else family = 'special';
    if(!families[family]) families[family] = [];
    families[family].push(a);
  });
  return families;
}
data.animations = getFamilies(allAnims);

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'copied!';
    setTimeout(() => btn.textContent = 'copy', 1200);
  });
}

function makeItem(name, query) {
  const hi = query && name.toLowerCase().includes(query.toLowerCase());
  return `<div class="item${hi?' highlight':''}">
    <span>${name}</span>
    <button class="copy-btn" onclick="copyText('${name}',this)">copy</button>
  </div>`;
}

function makeSubsection(title, items, query) {
  const filtered = query ? items.filter(i => i.toLowerCase().includes(query.toLowerCase())) : items;
  if(filtered.length === 0) return '';
  const id = 'sub_' + title.replace(/[^a-z0-9]/gi,'_');
  return `<div class="subsection">
    <div class="subsection-header" onclick="toggleSub('${id}')">
      <span class="subsection-title">${title}</span>
      <span style="font-size:12px;color:#888780">${filtered.length} <span id="chev_${id}">▼</span></span>
    </div>
    <div class="subsection-body" id="${id}">
      ${filtered.map(i => makeItem(i, query)).join('')}
    </div>
  </div>`;
}

function makeSection(icon, title, groups, query) {
  let body = '';
  let total = 0;
  Object.entries(groups).forEach(([k,v]) => {
    const s = makeSubsection(k, v, query);
    if(s) { body += s; total += (query ? v.filter(i=>i.toLowerCase().includes(query.toLowerCase())).length : v.length); }
  });
  if(query && total === 0) return '';
  const id = 'sec_' + title.replace(/[^a-z0-9]/gi,'_');
  const open = query ? ' open' : '';
  return `<div class="section">
    <div class="section-header" onclick="toggleSec('${id}')">
      <span class="section-title"><span class="section-icon">${icon}</span>${title}</span>
      <span style="display:flex;align-items:center;gap:8px">
        <span class="count-badge">${total}</span>
        <span class="chevron${open}" id="chevSec_${id}">▼</span>
      </span>
    </div>
    <div class="section-body${open}" id="${id}">${body}</div>
  </div>`;
}

function toggleSec(id) {
  document.getElementById(id).classList.toggle('open');
  document.getElementById('chevSec_'+id).classList.toggle('open');
}
function toggleSub(id) {
  document.getElementById(id).classList.toggle('open');
}

function render(query) {
  const el = document.getElementById('content');
  let html = '';
  html += makeSection('⚙️', 'Behaviors', data.behaviors, query);
  html += makeSection('⚡', 'Animation triggers', data.triggers, query);
  html += makeSection('▶️', 'Animations (raw IDs)', data.animations, query);
  if(!html.trim()) html = '<div class="no-results">No results found.</div>';
  el.innerHTML = html;
}

function filterAll() {
  render(document.getElementById('search').value.trim());
}
